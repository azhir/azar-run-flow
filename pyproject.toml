[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azar-run-flow"
version = "0.1.0"
description = "Lightweight reproducible experiment tracking."
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3",
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]