[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azar-run-flow"
version = "0.1.0"
description = "Lightweight reproducible experiment tracking."
requires-python = ">=3.10"

dependencies = [
    "mlflow>=3,<4",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]