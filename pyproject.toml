[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azar-run-flow"
version = "0.2.0"
description = "Lightweight reproducible experiment tracking."
requires-python = ">=3.10"

dependencies = [
    "mlflow>=3,<4",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "psutil>=5.9",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
]

[project.optional-dependencies]
zen = [
    "hydra-zen>=0.16,<0.17",
]

dev = [
    "pytest>=8",
    "hydra-zen>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]